- question: 이 데이터는 어디에서 어떤 방법으로 받는가?
  inspect:
    - 공식 배포 페이지, 파일 다운로드, API endpoint, 수령 절차를 확인
    - 인증, 신청, 결제, 요청 parameter 등 접근 조건을 확인
    - 동일 버전이나 특정 시점을 지정해 받을 수 있는지 확인
  answer_must_cover:
    - 획득 위치와 방법
    - 필요한 인증·신청·parameter와 버전·시점 지정 방법
    - 판단에 사용한 근거

- question: 전체를 빠짐없이 받을 수 있는가, 잘리거나 누락될 위험이 있는가?
  inspect:
    - 페이지 나누기, 건수 상한, 전송 한도, export 경로를 확인
    - 절단·누락을 알 수 있는 신호(전송 한도 표시, 전체 건수 대비 반환 건수 등)를 확인
    - 페이지·구간을 이어 받을 때 정렬 고정이 필요한지 확인
  answer_must_cover:
    - 전량 수집에 필요한 요청 조건과 종료 조건
    - 절단·누락 탐지 방법
    - 완전한 수집을 보장할 수 있는지와 그 근거

- question: 같은 경로로 다시 받으면 내용이 달라질 수 있는가?
  inspect:
    - 동일 요청·동일 다운로드를 다른 시점에 비교할 수 있는지 확인
    - 갱신 주기, 기준 시각, 버전·스냅샷 지정 가능 여부를 확인
    - 삭제된 레코드와 과거 상태를 다시 조회하는 방법을 확인
  answer_must_cover:
    - 응답·파일이 바뀌는 조건과 확인된 변화
    - 과거 상태·버전 고정 가능 여부
    - 수집 시점이 재현성과 분석 기준일에 미치는 영향

- question: 이미 가공·병합된 데이터라면, 그 이전 원본과 가공에 대해 무엇을 알 수 있는가?
  inspect:
    - 제공 데이터가 원본인지, 병합·변환·집계를 거친 것인지 확인
    - 입력 원본의 식별자·버전·제공자와 가공 주체를 확인
    - 우리 파이프라인이 아닌 외부에서 한 처리만 대상으로 함
  answer_must_cover:
    - 외부 가공 여부와 알려진 입력·가공 내용
    - 알 수 없는 upstream 단계
    - 결과 해석에 미치는 영향

- question: 이 데이터는 어떤 조건에서 이용·가공·재배포할 수 있는가?
  inspect:
    - 배포 페이지, 원문 라이선스, 저작권·이용 정책을 확인
    - 이용 목적, 출처 표시, 변경 허용, 상업 이용, 재배포 제한을 확인
    - 여러 출처나 입력 데이터의 조건이 서로 다르거나 충돌하는지 확인
  answer_must_cover:
    - 적용되는 라이선스나 이용 조건과 권리자
    - 이용·가공·재배포 때 지켜야 할 제한과 표시 의무
    - 조건을 확인한 원문 근거와 상충하는 정보

- question: 값을 해석하려면 어떤 문서·코드표·방법이 어디에 있는가?
  inspect:
    - 데이터 사전, 분류 기준, 코드표, 조사 지침과 방법론 문서의 위치와 존재 여부를 확인
    - 단위, 값의 정의, 모집단, 표본, 기준연도 해석에 필요한 자료를 확인
    - 외부 표나 문서 없이는 해석할 수 없는 필드가 있는지 확인
  answer_must_cover:
    - 필요한 해석 자료와 그 위치
    - 문서가 없거나 불완전한 항목
    - 해석 자료가 분석에 필요한 이유

- question: 서로 다른 출처·문서·필드가 충돌할 때 무엇이 확인됐고, 무엇을 미결로 남기는가?
  inspect:
    - 배포 페이지, API 메타, 첨부 문서, 데이터 필드 사이 불일치를 대조
    - 좌표계 코드, 기관명, 권리 표기, 날짜 의미처럼 자주 어긋나는 항목을 확인
    - 어느 출처를 우선할지 문서에 규칙이 있는지 확인
  answer_must_cover:
    - 확인된 충돌과 각 출처의 주장
    - 채택·보류·사람 판정으로 넘긴 항목
    - 충돌 판단의 근거

- question: 생산자·제공자가 밝힌 품질·오차·한계 진술은 무엇인가?
  inspect:
    - 생산자와 제공자가 공개한 품질 관리, 검수, 정확도·오차 진술을 확인
    - 검사 대상·기준·시점과 결과 공개 범위를 확인
    - 진술이 없으면 그 사실을 기록
  answer_must_cover:
    - 공개된 품질·오차·한계 진술과 확인 주체
    - 검사 범위와 공개된 결과, 또는 미공개
    - 진술을 뒷받침하는 근거
