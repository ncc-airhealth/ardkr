- question: 공간해상도는 무엇인가?
  inspect:
    - 픽셀 크기, 격자 간격, 해상도 표기를 파일·출처 문서에서 확인
    - 밴드·오버뷰마다 해상도가 다른지 확인
    - 분석에 쓸 해상도와 제공 해상도가 같은지 확인
  answer_must_cover:
    - 확인된 공간해상도
    - 밴드·오버뷰별 차이
    - 공간 분석 단위에 주는 제약
  when_unanswerable:
    - 확인한 파일·문서
    - 제공되지 않은 해상도 정보
    - 적정 분석 단위를 정할 수 없어 남는 불확실성

- question: 복사해상도는 무엇인가?
  inspect:
    - 화소값의 양자화·비트 깊이·방사 해상도 표기를 확인
    - 센서·제품 문서의 복사·방사 특성을 확인
    - 값 범위가 복사해상도와 맞는지 표본으로 확인
  answer_must_cover:
    - 확인된 복사해상도 또는 동등한 표기
    - 값 해석에 주는 제약
    - 판단 근거
  when_unanswerable:
    - 확인한 문서와 메타데이터
    - 제공되지 않은 복사해상도 정보
    - 방사·밝기 값 해석에 남는 불확실성

- question: 분광해상도(밴드 구성)는 무엇인가?
  inspect:
    - 밴드 수, 각 밴드의 파장·이름·역할을 확인
    - 밴드 순서와 합성·인덱스 계산에 필요한 매핑을 확인
    - 문서와 파일 밴드 수가 같은지 대조
  answer_must_cover:
    - 밴드 구성과 각 밴드의 의미
    - 분광 분석·지수 계산에 주는 제약
    - 판단 근거
  when_unanswerable:
    - 확인한 밴드 메타·문서
    - 제공되지 않은 밴드·파장 정보
    - 분광 해석에 남는 불확실성

- question: 기하 정확도(기하보정 품질)는 어떠한가?
  inspect:
    - 기하보정·정사보정 수준과 정확도 지표를 출처 문서에서 확인
    - 기준점·검수 방법·허용 오차가 제공되는지 확인
    - 제품 단계(원시, 보정, 정사 등)를 확인
  answer_must_cover:
    - 확인된 기하보정 수준과 정확도
    - 위치 기반 활용에 주는 제약
    - 판단 근거
  when_unanswerable:
    - 확인한 기하 관련 문서
    - 제공되지 않은 보정·정확도 정보
    - 기하 오차 해석에 남는 불확실성

- question: 손실압축·리샘플링 등으로 값이 원본으로부터 왜곡되었는가?
  inspect:
    - 압축 방식(손실/무손실), 리샘플링·피라미드 생성 여부를 확인
    - 원본 제품과 배포 제품의 처리 단계를 대조
    - 값 왜곡이 분석에 미치는 영향을 출처에서 확인
  answer_must_cover:
    - 확인된 압축·리샘플링·유사 처리
    - 원본 대비 값 왜곡 여부 또는 미확인
    - 정량 분석에 주는 제약
  when_unanswerable:
    - 확인한 처리·포맷 문서
    - 알 수 없는 압축·리샘플 설정
    - 값 왜곡 여부를 판단하지 못해 남는 불확실성

- question: nodata, datatype, scale factor, offset 등은 어떻게 정의되어 있는가?
  inspect:
    - nodata·마스크, 자료형, scale factor, offset를 파일 메타와 문서에서 확인
    - 실제 값에 배율·오프셋을 적용하는 규칙을 확인
    - 밴드마다 정의가 다른지 확인
  answer_must_cover:
    - nodata·자료형·scale·offset 정의
    - 물리량으로 되돌리는 방법
    - 잘못 적용할 때 생기는 오류 위험
  when_unanswerable:
    - 확인한 메타·문서
    - 제공되지 않은 값 변환 규칙
    - 화소값 해석에 남는 불확실성

- question: 파일 안 메타데이터와 출처가 제공한 메타데이터는 어떻게 다르거나 같은가?
  inspect:
    - 파일에 저장된 메타(태그, sidecar, 내부 헤더)를 확인
    - 배포 페이지, 제공자 API·카탈로그, 첨부 문서의 메타를 확인
    - 해상도, 밴드, nodata, 좌표계, 날짜 등에서 차이를 대조
  answer_must_cover:
    - 일치하는 항목과 불일치하는 항목
    - 불일치 시 어느 쪽을 쓰는지, 미결인지
    - 판단 근거
  when_unanswerable:
    - 대조한 파일 메타와 제공 메타 출처
    - 비교하지 못한 항목
    - 어느 메타를 믿을지 정해지지 않아 남는 불확실성
