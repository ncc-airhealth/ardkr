- question: 이 데이터가 쓰는 좌표계는 무엇인가?
  inspect:
    - 파일·서비스 응답·출처 문서에서 좌표계 식별자를 확인
    - 축 순서(경도·위도 등)와 여러 asset·레이어 간 좌표계 차이를 확인
    - 문서에 적힌 좌표계와 파일·응답에 나타나는 좌표계가 같은지 대조
  answer_must_cover:
    - 확인된 좌표계와 축 순서
    - asset·레이어별로 다르면 그 차이
    - 판단에 사용한 근거
  when_unanswerable:
    - 좌표계를 찾기 위해 확인한 파일·응답·문서
    - 식별할 수 없었던 좌표계 정보
    - 좌표계를 확정할 수 없는 이유
    - 위치 해석에 남는 불확실성

- question: 이 데이터가 다루는 지역은 어디인가?
  inspect:
    - 파일·서비스 응답에서 공간 범위(서쪽·남쪽·동쪽·북쪽 끝)를 확인
    - 출처가 밝힌 대상 지역 설명과 대조
    - 여러 asset·레이어가 있으면 범위 차이를 확인
  answer_must_cover:
    - 데이터가 다루는 지역의 공간 범위
    - asset·레이어별 범위 차이
    - 판단에 사용한 근거
  when_unanswerable:
    - 범위를 찾기 위해 확인한 파일·응답·문서
    - 확인할 수 없었던 공간 범위 정보
    - 다루는 지역을 확정할 수 없는 이유
    - 공간 분석 대상 설정에 남는 불확실성
