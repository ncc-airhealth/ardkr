- question: 한 행이 무엇을 가리키는가?
  inspect:
    - 한 행이 나타내는 단위(개인, 구역, 거래, 집계 구간 등)를 출처와 스키마에서 확인
    - 행 단위가 데이터셋 설명과 같은지 확인
    - 집계·조인 전에 행 단위를 오해할 여지가 있는지 확인
  answer_must_cover:
    - 행이 가리키는 단위
    - 행 단위가 분석·집계에 주는 제약
    - 판단 근거
  when_unanswerable:
    - 확인한 문서와 스키마
    - 행 단위를 확정할 수 없는 이유
    - 집계·조인 해석에 남는 불확실성

- question: 행을 구분하는 키와 중복·결측 규칙은 무엇인가?
  inspect:
    - 행 식별에 쓰는 키 후보를 확인
    - 키의 고유성·결측·중복 허용 여부를 출처와 표본에서 확인
    - geometry 열은 `vector` 결과를 참조하고, 여기서는 표·속성 키에 집중
  answer_must_cover:
    - 식별 키와 고유성·중복·결측 규칙
    - 규칙 위반이 조인·집계에 미치는 영향
    - 판단 근거
  when_unanswerable:
    - 확인한 키 후보
    - 규칙을 확정할 수 없는 이유
    - 행을 잘못 합치거나 나누게 될 가능성

- question: 열과 열 사이의 제약·종속·계산 관계는 무엇인가?
  inspect:
    - 열 조합에 대한 허용·금지 규칙을 문서와 코드표에서 확인
    - 한 열 값이 다른 열의 결측·범위를 결정하는지 확인
    - 파생·계산 열과 입력 열의 관계를 확인
  answer_must_cover:
    - 확인된 열 간 제약·종속·계산 관계
    - 위반 시 분석에 주는 영향
    - 판단 근거
  when_unanswerable:
    - 확인한 문서와 표본
    - 관계를 확정할 수 없는 이유
    - 논리적 일관성 가정에 남는 불확실성

- question: 표가 여러 개일 때 표 사이의 관계는 무엇인가?
  inspect:
    - collection·asset·파일 단위로 표가 몇 개인지 확인
    - 표 간 1:1·1:N·독립 여부와 연결 키를 확인
    - 관계가 문서화되지 않았는지 확인
  answer_must_cover:
    - 표 목록과 상호 관계
    - 연결 키와 조인 규칙, 또는 관계 미문서화
    - 다중 표 분석에 주는 제약
  when_unanswerable:
    - 확인한 표·asset과 문서
    - 관계를 확정할 수 없는 이유
    - 표를 함께 쓸 때 남는 불확실성

- question: 열마다 빈 값·코드값·범주값은 어떻게 해석해야 하는가?
  inspect:
    - 열별로 null, 빈 문자열, sentinel 값, 코드값의 의미를 확인
    - 같은 표기라도 열마다 의미가 다른지 확인
    - 해석 문서의 위치는 `derived-data` 결과를 참조하고, 여기선 열 단위 의미에 집중
  answer_must_cover:
    - 열별 결측·코드·범주 해석 규칙
    - 오해석 시 생기는 오류 위험
    - 판단 근거
  when_unanswerable:
    - 확인한 열과 문서
    - 열 단위 해석을 확정할 수 없는 이유
    - 결측·코드 처리에 남는 불확실성

- question: 각 열의 의미는 무엇인가?
  inspect:
    - 열 이름·설명·단위·허용 범위·유효 자릿수·반올림 규칙을 확인
    - 문서에 없는 열은 미문서화로 기록
    - geometry 열의 공간 의미는 `vector`에 맡기고, 속성 열에 집중
  answer_must_cover:
    - 열별 의미·단위·범위·정밀도
    - 미문서화 열 목록
    - 열 선택과 값 해석에 주는 제약
  when_unanswerable:
    - 확인한 스키마·문서
    - 의미를 확정할 수 없는 열
    - 속성 해석에 남는 불확실성
