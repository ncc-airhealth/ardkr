- question: 이 데이터의 생산·수집·가공·제공에 누가 어떤 역할로 참여했는가?
  inspect:
    - 원 생산자, 수집 기관, 가공 주체, 현재 제공자를 출처 문서와 배포 화면에서 확인
    - 기관명 변경, 위탁, 재배포, 중간 제공처가 있는지 확인
    - 각 주체가 원자료 생성, 변환, 품질 관리, 배포 중 무엇을 맡았는지 대조
  answer_must_cover:
    - 확인된 참여 주체와 각 주체의 역할
    - 원 생산자와 현재 제공자가 다를 때 데이터가 전달된 경로
    - 역할 판단에 사용한 문서나 데이터의 근거

- question: 이 데이터는 무엇을 나타내는가?
  inspect:
    - 데이터셋·레이어·제품이 다루는 대상과 적용 범위를 출처 문서에서 확인
    - 분석·집계에 쓰는 단위(개인, 구역, 사건, 집계 구간 등)를 확인
    - 이름·설명만으로 의미가 모호한 부분이 있는지 확인
  answer_must_cover:
    - 데이터가 나타내는 대상과 적용 범위
    - 해석에 쓰는 단위
    - 의미 판단의 근거

- question: 이 데이터가 나타내는 시점과 실제로 생성·공개·갱신된 시점은 각각 언제인가?
  inspect:
    - 관측·기준·유효 시점과 생성·공개·최종 갱신 시점을 각각 확인
    - 파일 timestamp, API 응답, 배포 페이지와 출처 문서의 날짜를 대조
    - 날짜가 단일 시점인지 기간인지, timezone과 갱신 주기가 있는지 확인
  answer_must_cover:
    - 데이터가 나타내는 시점 또는 기간과 그 의미
    - 생성·공개·갱신 시점 및 갱신 주기
    - 서로 다른 날짜의 출처와 불일치 여부
