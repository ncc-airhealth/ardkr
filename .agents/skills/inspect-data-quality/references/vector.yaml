- question: 각 geometry는 무엇을 나타내며, geometry 유형과 multipart 객체는 어떻게 해석해야 하는가?
  inspect:
    - 스키마와 출처 문서에서 레코드별 공간 객체의 의미를 확인
    - 실제 geometry 유형과 선언·기대 유형이 일치하는지 확인
    - multipart의 각 부분이 하나의 객체로 묶인 기준을 확인
  answer_must_cover:
    - geometry가 나타내는 공간 객체와 단위
    - geometry 유형별 의미와 예외
    - multipart 객체의 구성 기준과 분석 시 해석 방법
  when_unanswerable:
    - 확인한 스키마·문서와 geometry 유형
    - 제공되지 않은 객체 정의와 multipart 구성 기준
    - 객체 수·면적·연결성을 해석할 때 남는 불확실성

- question: 빈 geometry와 유효하지 않은 geometry에 관해 무엇을 확인했는가?
  inspect:
    - null·empty geometry의 존재 여부와 해당 레코드의 속성을 표본으로 확인
    - 사용 중인 유효성 규칙과 검사 방법을 밝히고, 보이는 오류 유형을 확인
    - geometry가 처리 중 삭제·수정·유지되었는지 출처·처리 기록을 확인
  answer_must_cover:
    - 빈 geometry와 유효하지 않은 geometry의 유형과 파악한 범위
    - 적용한 유효성 기준과 검사 방법
    - 해당 geometry의 처리 여부와 분석에 미치는 영향
  when_unanswerable:
    - 실행한 조사와 조사하지 못한 geometry
    - 판정 기준이나 원본 상태를 알 수 없는 이유
    - 공간 집계·조인에서 빠질 수 있는 레코드의 불확실성

- question: geometry 사이의 중첩·틈·연결·경계 관계에는 어떤 예외가 있는가?
  inspect:
    - 데이터가 기대하는 위상 관계를 출처 문서와 용도에서 확인
    - 구역을 빈틈없이 나눠야 하거나, 연결망이어야 하는 등 위상 검사가 필요한 용도인지 먼저 판단
    - 필요한 경우에만 중첩·틈·비연결·경계 교차를 관계별로 조사
    - 위상 검사가 불필요하면 생략 근거를 남김
  answer_must_cover:
    - 기대한 위상 관계와 적용 범위, 또는 검사를 생략한 이유
    - 발견한 중첩·틈·연결·경계 예외
    - 예외가 면적 합계·인접성·네트워크 분석에 주는 영향
  when_unanswerable:
    - 확인한 위상 규칙과 수행한 관계 조사
    - 허용 여부를 판단할 수 없는 공간 관계
    - 위상 가정이 필요한 분석에 남는 불확실성

- question: 한 행이 하나의 공간 객체로 대응하는지, 식별자와 중복은 어떠한가?
  inspect:
    - geometry와 속성이 같은 행에 있는 표에서 행 단위 대응을 확인
    - 식별자 후보의 고유성·결측을 확인
    - 별도 geometry 표와 속성 표가 있을 때만 연결 키와 고아 레코드를 확인
  answer_must_cover:
    - 행·객체 대응 방식과 식별자
    - 중복·결측·고아 레코드의 형태
    - 불일치가 조인과 집계에 미치는 영향
  when_unanswerable:
    - 확인한 식별자 후보와 대응 결과
    - 대응 규칙을 확정할 수 없는 이유
    - geometry와 속성을 잘못 연결할 가능성

- question: Z·M 좌표는 있는가, 의미와 단위는 무엇인가?
  inspect:
    - Z·M(또는 measure) 좌표의 존재 여부를 확인
    - 의미·단위와 분석 도구의 지원 여부를 확인
    - 값이 실제로 쓰이는지, 무시·제거되는지 확인
  answer_must_cover:
    - Z·M 존재 여부와 의미·단위
    - 도구 지원과 실제 사용 상태
    - 차원 분석에 생기는 제약
  when_unanswerable:
    - 확인한 좌표 차원과 사용 도구
    - 알 수 없는 Z·M 단위·의미
    - 차원 오해로 남는 분석 불확실성

- question: 레이어·asset이 여러 개일 때 geometry 사이 관계는 무엇인가?
  inspect:
    - 여러 geometry 레이어·asset의 역할을 출처와 이름에서 확인
    - 포함·인접·중심선과 경계처럼 공간·의미 관계가 있는지 확인
    - 관계가 문서화되지 않았는지 확인
  answer_must_cover:
    - 레이어·asset별 geometry 역할
    - 확인된 상호 관계 또는 관계 미문서화
    - 다중 레이어 분석에 주는 제약
  when_unanswerable:
    - 확인한 레이어·asset과 문서
    - 관계를 확정할 수 없는 이유
    - 레이어를 함께 쓸 때 남는 불확실성

- question: 위치·경계 정확도 또는 제작 축척에 관해 무엇을 알 수 있는가?
  inspect:
    - 출처 문서에서 위치·경계 정확도 지표, 측량·작성 방법, 제작 축척을 확인
    - 법적·행정적 경계와 관측·디지타이징 경계를 구분할 수 있는지 확인
    - 정확도와 축척 중 제공된 쪽을 기록하고, 둘 다 없으면 그 사실을 남김
  answer_must_cover:
    - 확인된 정확도 또는 제작 축척
    - 산정·작성 방법과 적용 범위
    - 위치 기반 분석에 주는 제약
  when_unanswerable:
    - 확인한 정확도·축척 관련 문서
    - 제공되지 않은 정확도·축척 정보
    - 오차와 세밀도 해석에 남는 불확실성
