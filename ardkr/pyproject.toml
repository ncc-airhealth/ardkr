[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ardkr"
version = "0.0.0"
description = "Spatial-data pipeline and STAC catalog utilities (agent-native)"
# Root README.md is the package readme; ardkr is one component of the monorepo.
requires-python = ">=3.12"
# Keep the core dependency-free. Features come only via extras below.
# (The process-script runner lives in pipeline/, not this package → pipeline/run.py)
dependencies = []

[project.optional-dependencies]
# Strict extras: installing [pipeline] must not pull dashboard/modeling deps.
# Each list starts with anchor deps only; extend as features land (TODO).
catalog = ["pystac>=1.10"]
storage = ["boto3>=1.34"]
pipeline = ["pystac>=1.10", "boto3>=1.34"]
dashboard = ["marimo>=0.9", "pystac>=1.10"]
modeling = ["numpy>=2.0", "pandas>=2.2"]
# Convenience meta-extra: everything.
all = [
  "pystac>=1.10",
  "boto3>=1.34",
  "marimo>=0.9",
  "numpy>=2.0",
  "pandas>=2.2",
]
# Package-local dev tools (uv). Unrelated to the Docker+pixi process runtime.
dev = ["pytest>=8", "ruff>=0.6"]

# TODO: until tagged releases, process scripts pin ardkr by git commit.
#   e.g. dependencies = ["ardkr[pipeline] @ git+<repo-url>@<commit>"]
# Fill [project.urls] when the remote is fixed.

[tool.hatch.build.targets.wheel]
packages = ["ardkr"]

[tool.ruff]
target-version = "py312"
line-length = 80
